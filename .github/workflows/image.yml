name: Image

# Publishes the service image to GHCR, so a server can `docker pull` it instead
# of building anything. That matters on a small host: building the Go binary in
# a container peaks at 1.5-2 GB, which on this deployment's 3.6 GB server —
# shared with other services — starved the machine until sshd stopped answering.
#
# Triggers:
#   - a version tag (v1.2.3)  -> publishes :1.2.3, :1.2, :latest and :sha-<short>
#   - manual dispatch         -> publishes :latest and :sha-<short> only
#
# The image is built from `deploy/Dockerfile`, the same file the source-build
# path uses, because a hosted runner has memory to spare.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags for a release are derived from the git tag; a manual run gets only
      # `latest` and the commit, so a dispatch can never overwrite a released
      # version number by accident.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The runner has network access to Go's proxy; the goproxy.cn default
          # in the compose guide exists for Chinese servers, not for CI.
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha
          cache-to: type=gha,mode=max
